<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joke Gen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css?family=Playpen+Sans:100,200,300,regular,500,600,700,800"
        rel="stylesheet" />
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.css'
        integrity='sha512-NhLySQDkiKSKnT+R795uaHWRQ7D3VuIvgeOLCK8cWq4w5fq4sWF90gj8eURpTqn/f1mFzqClpOz8JPlgVTLfFw=='
        crossorigin='anonymous' />
    <link
        href="https://fonts.googleapis.com/css?family=Open+Sans:300,regular,500,600,700,800,300italic,italic,500italic,600italic,700italic,800italic"
        rel="stylesheet" />
    <link rel="icon" type="image/png" href="/images/Logo.png">
</head>

<body>
    <div class="wrap">
        <div class="server_Msg" id="server_Message">
            <h3>Server is currently slepping (please wait)</h3>

            <button id="server_retry_Btn">Retry</button>
        </div>

        <div class="header">
            <div class="logo">
                <img src="images/Logo.png" alt="Mantom">
                <p>Mantom Jokes</p>
            </div>
            <div class="liked_Header_Div">
                <button><i class="fa-solid fa-heart"></i></button>
            </div>
        </div>
        <div class="main">
            <div class="joke_Consume_Div">
                <div class="joke_Container">
                    <div class="JC_Joke">
                        <h3 id="joke_label">Joke here</h3>
                    </div>
                    <div class="JC_Author">
                        <h4 id="author_label">Author</h4>
                    </div>
                </div>
                <div class="joke_Heart_Container">
                    <button><i class="fa-solid fa-heart"></i></button>
                </div>
                <div class="joke_Btns">
                    <button id="report_Btn"><i class="fa-solid fa-flag"></i></button>
                    <button id="spin_Btn"><i class="fa-solid fa-rotate"></i></button>
                    <button id="add_Btn"><i class="fa-solid fa-plus"></i></button>
                </div>
            </div>

            <div class="joke_Creation_Div">
                <div class="joke_Inputs">
                    <textarea placeholder="Joke" id="joke_Content_Inp"></textarea>
                    <input placeholder="Author" type="text" id="joke_Author_Inp">
                </div>
                <div class="joke_Creation">
                    <div class="joke_Display_Div">
                        <div class="joke_Container">
                            <div class="JC_Joke">
                                <h3 id="joke_label_Creation">Joke here</h3>
                            </div>
                            <div class="JC_Author">
                                <h4 id="author_label_Creation">Author</h4>
                            </div>
                        </div>
                    </div>
                    <div class="joke_Creation_Btns">
                        <button id="JokeCancelBtn">Cancel</button>
                        <button id="JokeCreateBtn">Submit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
